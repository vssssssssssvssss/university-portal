{% extends "base.html" %}
{% block title %}Post notice{% endblock %}
{% block content %}
<div class="container">
    <h1 class="page-title">Post a notice</h1>
    <p class="page-sub">Every student sees it on their notice board straight away.</p>
    {% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <div class="panel form-card"><div class="panel-body">
        <form method="POST" action="/coordinator/post-notice">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" required>
            </div>
            <div class="form-group">
                <label for="content">Notice text</label>
                <textarea name="content" id="content" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn">Post notice</button>
        </form>
    </div></div>
</div>
{% endblock %}
