{% extends "base.html" %}
{% block title %}Add result{% endblock %}
{% block content %}
<div class="container">
    <h1 class="page-title">Add a result</h1>
    <p class="page-sub">Saving again for the same student, subject and year updates the marks.</p>
    {% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <div class="panel form-card"><div class="panel-body">
        <form method="POST" action="/coordinator/add-result">
            <div class="form-group">
                <label for="student_id">Student</label>
                <select name="student_id" id="student_id" required>
                    {% for s in students %}<option value="{{ s.id }}">{{ s.roll_number }} - {{ s.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="subject_id">Subject</label>
                <select name="subject_id" id="subject_id" required>
                    {% for sub in subjects %}<option value="{{ sub.id }}">{{ sub.subject_code }} - {{ sub.subject_name }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="marks">Marks obtained</label>
                <input type="number" name="marks" id="marks" min="0" required>
            </div>
            <div class="form-group">
                <label for="semester">Semester</label>
                <select name="semester" id="semester" required>
                    {% for n in range(1, 9) %}<option value="{{ n }}" {% if n == 3 %}selected{% endif %}>{{ n }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="academic_year">Academic year</label>
                <input type="text" name="academic_year" id="academic_year" placeholder="e.g. 2025-26" required>
            </div>
            <button type="submit" class="btn">Save result</button>
        </form>
    </div></div>
</div>
{% endblock %}
